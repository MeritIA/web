name: APK de Android

# Construye la APK de depuracion y la deja descargable como artefacto.
#
# Se hace aqui y no en el portatil de alguien porque compilar Android exige el
# SDK (~2 GB) y un JDK 21: el runner de GitHub ya los trae. Ademas sale igual
# para todos, que es lo que se quiere de una entrega.

on:
  workflow_dispatch:
    inputs:
      api:
        description: URL de la API que usara la APK (absoluta, termina en /api/v1)
        required: false
        default: https://meritia-backend.purpleglacier-76ab2c43.chilecentral.azurecontainerapps.io/api/v1
  push:
    tags:
      - 'apk-*'

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Gradle 8.14 no soporta JDK 25; 21 es el ultimo que acepta.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Sin `android-actions/setup-android`: intenta instalar el paquete `tools`,
      # que Google retiro, y aborta. El runner ya trae el SDK; solo hay que
      # asegurarse de la plataforma y las build-tools que pide el proyecto.
      - name: Preparar el SDK de Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "SDK en $SDK, gestor $MGR"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$MGR" --licenses > /dev/null 2>&1 || true
          "$MGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar dependencias
        run: npm ci

      - name: Construir web, sincronizar y compilar la APK
        env:
          API_MOVIL: ${{ github.event.inputs.api || 'https://meritia-backend.purpleglacier-76ab2c43.chilecentral.azurecontainerapps.io/api/v1' }}
        run: npm run movil:apk

      - name: Publicar la APK
        uses: actions/upload-artifact@v4
        with:
          name: meritia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
