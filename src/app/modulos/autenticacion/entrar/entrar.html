<main class="pantalla">
  <section class="tarjeta caja">
    <header class="caja__cabecera">
      <p class="marca">Merit<span>IA</span></p>
      <h1>Entra a tu cuenta</h1>
      <p class="caja__sub">Evaluación por reto, no por hoja de vida.</p>
    </header>

    @if (error(); as mensaje) {
      <p class="aviso aviso--error" role="alert">{{ mensaje }}</p>
    }

    <form (submit)="enviar($event)" novalidate>
      <label class="campo">
        <span class="campo__nombre">Correo</span>
        <input
          type="email"
          name="correo"
          autocomplete="email"
          required
          [value]="correo()"
          (input)="correo.set($any($event.target).value)"
        />
      </label>

      <label class="campo">
        <span class="campo__nombre">Contraseña</span>
        <input
          type="password"
          name="contrasena"
          autocomplete="current-password"
          required
          [value]="contrasena()"
          (input)="contrasena.set($any($event.target).value)"
        />
      </label>

      <button
        class="boton boton--principal caja__enviar"
        type="submit"
        [disabled]="enviando() || !correo().trim() || !contrasena()"
      >
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="caja__pie">¿No tienes cuenta? <a href="/crear-cuenta">Crea una</a>.</p>
  </section>
</main>
